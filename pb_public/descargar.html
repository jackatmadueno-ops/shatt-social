<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shatt</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #3a6186;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 48px; font-weight: 900; color: #3a6186; }
        .logo span { color: #fbc02d; }
        .subtitle { color: #666; margin: 10px 0 30px; font-size: 14px; }
        .btn-download {
            display: block;
            width: 100%;
            padding: 18px;
            background: #3a6186;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-download:hover { transform: translateY(-2px); background: #2a4a6a; }
        .btn-web {
            display: block;
            width: 100%;
            padding: 16px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-web:hover { background: #e0e0e0; }
        .version { color: #999; font-size: 12px; margin-top: 20px; }
        .icon { font-size: 64px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📱</div>
        <div class="logo">SHA<span>TT</span></div>
        <p class="subtitle">Conéctate con todos en una red social libre</p>

        <a href="/apks/shatt.apk" class="btn-download">📥 Descargar APK (Android)</a>
        <a href="/inicio.html" class="btn-web">🌐 Usar versión web</a>

        <p class="version">Versión 3.0 · 20 MB</p>
        <p style="font-size: 11px; color: #aaa; margin-top: 8px;">⚠️ Solo para Android 5.0 o superior</p>
    </div>
</body>
</html>
